<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>مبارزة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;900&display=swap">
<style>
/* Same saffron-poster system as جيو!: halftone saffron, hard offset shadows, extruded titles. TV shows the duel; phones are controllers. */
:root {
  --saffron: #F2B705; --deep: #6B5200; --ink: #111111; --paper: #FFFFFF;
  --grey: #2A2A2A; --grey2: #3A3A3A; --muted: #CFCFCF; --red: #D62828; --wine: #B3261E; --green: #1F7A4D; --focus: #1F4FB3;
  --font: "Alexandria", Tahoma, "Noto Sans Arabic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--ink); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; }
[hidden] { display: none !important; }
button, input { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.dots { background-color: var(--saffron); background-image: radial-gradient(rgba(17,17,17,.13) 1.3px, transparent 1.8px); background-size: 9px 9px; }
.extrude { text-shadow: 6px 6px 0 var(--paper), 12px 12px 0 var(--ink); }
.ltr { direction: ltr; unicode-bidi: isolate; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { font-weight: 700; font-size: 16px; line-height: 1.4; padding: 10px 18px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.btn.dark { background: var(--ink); color: var(--saffron); box-shadow: 6px 6px 0 var(--paper); }
.btn.ok { background: var(--green); color: var(--paper); }
.btn.big { font-size: 26px; font-weight: 900; padding: 14px 30px; }
.btn.sm { font-size: 14px; padding: 4px 10px; box-shadow: 2px 2px 0 var(--ink); }
.btn.sel { background: var(--ink); color: var(--saffron); }
.btn:disabled { opacity: .45; cursor: default; }
.err { color: var(--wine); font-weight: 700; font-size: 15px; margin: 0; min-height: 1.6em; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wine); display: inline-block; flex: none; }
.dot.on { background: #3FBF7F; }
.pic { display: block; object-fit: contain; }
.pic.flag { border: 4px solid var(--ink); background: var(--paper); box-shadow: 10px 10px 0 var(--ink); }
.emo { display: block; text-align: center; line-height: 1; }
.credits { font-size: 12px; color: var(--muted); }
.pic.photo { object-fit: contain; background: var(--paper); }
/* The picture box: fills its parent; the picture is scaled to fit inside it */
.pbox { position: relative; flex: 1; min-height: 0; width: 100%; container-type: size; }
/* the picture sits in the largest square that fits the box */
.sq > .pic.icon { display: grid; place-items: center; }
.sq > .pic.icon svg { width: 72%; height: 72%; }
.pbox > .sq { position: absolute; inset: 0; margin: auto; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
.sq > .pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border: 0; box-shadow: none; }
.sq > .pic.photo { background: var(--paper); }
.sq > .pic.flag { background: transparent; }
.sq > .pic.emoji { inset: 6%; width: 88%; height: 88%; }
.sq > .emo { position: absolute; inset: 0; display: grid; place-items: center; font-size: min(38vh, 300px); }
.pcredit { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.pthumb { display: grid; place-items: center; width: 56px; height: 42px; background: var(--ink); color: var(--saffron); font-weight: 900; font-size: 13px; letter-spacing: .04em; }
.btn.sel .pthumb { background: var(--saffron); color: var(--ink); }

/* ---------- TV ---------- */
.tv { min-height: 100vh; display: flex; flex-direction: column; }
.pad { padding: 40px max(32px, env(safe-area-inset-right, 0px)) 40px max(32px, env(safe-area-inset-left, 0px)); }
.lobby { flex: 1; display: flex; flex-direction: column; gap: 28px; }
.lhead { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.lhead h1 { margin: 0; font-weight: 900; font-size: clamp(56px, 7vw, 92px); line-height: 1.3; }
.codebox { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--ink); color: var(--saffron); box-shadow: 6px 6px 0 var(--paper); }
.codebox .qr { width: 104px; background: var(--paper); padding: 4px; line-height: 0; }
.codebox .qr img, .codebox .qr canvas { width: 100%; height: auto; display: block; }
.codebox .code { font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: .08em; }
.versus { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 140px minmax(0, 1fr); gap: 24px; align-items: center; }
.pcard { display: flex; flex-direction: column; gap: 14px; padding: 28px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 12px 12px 0 var(--ink); min-width: 0; }
.pcard .who { font-weight: 900; font-size: clamp(40px, 5vw, 64px); line-height: 1.3; overflow-wrap: anywhere; }
.pcard .lbl { font-weight: 700; font-size: 18px; }
.pcard .cat { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--ink); color: var(--saffron); min-height: 84px; }
.pcard .cat.wait { background: transparent; color: var(--ink); border: 3px dashed var(--ink); }
.pcard .cat .pic { width: 72px; height: 54px; box-shadow: none; border-width: 2px; }
.pcard .cat .emo { font-size: 48px; width: 60px; }
.pcard .cat img.pic:not(.flag) { width: 56px; height: 56px; }
.pcard .cn { font-weight: 900; font-size: 30px; line-height: 1.3; }
.pcard.empty { border-style: dashed; box-shadow: none; background: transparent; }
.vs { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.vs b { font-weight: 900; font-size: 64px; line-height: 1.3; }
.queue { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { padding: 6px 14px; background: var(--paper); border: 3px solid var(--ink); font-weight: 700; font-size: 18px; line-height: 1.5; }
.chip .x { margin-inline-start: 8px; border: 0; background: none; font-weight: 900; color: var(--wine); padding: 0 4px; }
.stars { color: var(--deep); font-size: 14px; margin-inline-start: 6px; }

/* duel */
.duel { height: 100vh; height: 100svh; min-height: 0; display: flex; flex-direction: column; background: var(--ink); color: var(--paper); }
.dtop { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 20px; padding: 16px 32px 0; }
.pip { width: 16px; height: 16px; border: 2px solid #5A5A5A; display: inline-block; }
.pip.on { background: var(--saffron); border-color: var(--saffron); }
.clock.on .pip { border-color: var(--ink); } .clock.on .pip.on { background: var(--ink); }
.dcat { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.dcat .meta { font-weight: 700; font-size: 15px; color: var(--muted); }
.dcat .name { padding: 4px 18px; background: var(--saffron); color: var(--ink); font-weight: 900; font-size: 26px; line-height: 1.5; }
.clock { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 16px; padding: 12px 18px; background: var(--grey); color: var(--muted); box-shadow: 6px 6px 0 #000; transition: background .15s; }
.clock.on { background: var(--saffron); color: var(--ink); box-shadow: 6px 6px 0 var(--paper); }
.clock .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.clock .tag { font-weight: 700; font-size: 14px; line-height: 1.4; display: flex; align-items: center; gap: 6px; }
.clock .nm { font-weight: 900; font-size: 30px; line-height: 1.3; color: var(--paper); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clock.on .nm { color: var(--ink); }
.clock .t { font-weight: 900; font-size: 72px; line-height: 1; color: var(--paper); font-variant-numeric: tabular-nums; }
.clock.on .t { color: var(--ink); }
.clock.low .t { color: var(--red); }
.clock .bar { grid-column: 1 / -1; height: 10px; background: var(--grey2); display: flex; }
.clock.on .bar { background: rgba(17,17,17,.2); }
.clock .bar i { display: block; height: 100%; background: var(--muted); }
.clock.on .bar i { background: var(--ink); }
.clock.low .bar i { background: var(--wine); }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 16px 32px 12px; }
.frame { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #1B1B1B; border: 4px solid var(--saffron); position: relative; }
.fhead, .ffoot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.frame .q { font-weight: 700; font-size: 22px; color: var(--saffron); }
.frame .lvl { display: flex; gap: 4px; align-items: center; font-weight: 700; font-size: 14px; color: var(--muted); }
.frame .lvl i { width: 14px; height: 14px; border: 2px solid var(--muted); display: inline-block; }
.frame .lvl i.on { background: var(--saffron); border-color: var(--saffron); }
.frame .paused { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(17,17,17,.88); font-weight: 900; font-size: 64px; color: var(--saffron); z-index: 2; }
.frame .reveal { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); z-index: 1; padding: 6px 16px; background: var(--ink); color: var(--saffron); border: 3px solid var(--saffron); font-weight: 900; font-size: 26px; white-space: nowrap; }
.log { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; min-height: 36px; }
.log span { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: #1C1C1C; border: 2px solid var(--grey2); font-weight: 700; font-size: 16px; }
.log .v { padding: 0 6px; }
.log .v.ok { background: var(--green); } .log .v.no { background: var(--wine); } .log .v.pass { background: #555; }
.dbot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 32px 14px; border-top: 3px solid var(--saffron); flex-wrap: wrap; }
.dbot .hint { font-weight: 700; font-size: 16px; color: var(--muted); }
.dbot .btn.ghost { background: transparent; color: var(--paper); border-color: var(--paper); box-shadow: none; }
.count { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(17,17,17,.82); color: var(--saffron); font-weight: 900; font-size: 260px; line-height: 1; }
.count small { display: block; font-size: 32px; color: var(--paper); text-align: center; margin-top: 16px; }

/* round / match end */
.res { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px; }
.res .tag { align-self: flex-start; padding: 6px 16px; background: var(--ink); color: var(--saffron); font-weight: 900; font-size: 22px; line-height: 1.5; box-shadow: 6px 6px 0 var(--paper); }
.res h2 { margin: 0; font-weight: 900; font-size: clamp(64px, 8vw, 120px); line-height: 1.3; }
.score { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
.sbox { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 32px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); }
.sbox.win { background: var(--ink); color: var(--saffron); box-shadow: 10px 10px 0 var(--paper); }
.sbox .n { font-weight: 900; font-size: 28px; line-height: 1.4; }
.sbox .s { font-weight: 900; font-size: 88px; line-height: 1; }
.nextcat { padding: 10px 20px; background: var(--paper); border: 4px dashed var(--ink); font-weight: 900; font-size: 36px; line-height: 1.3; }
@media (max-width: 1000px) { .versus { grid-template-columns: 1fr; } .clock .t { font-size: 48px; } .clock .nm { font-size: 22px; } }
.setupbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--ink); color: var(--paper); box-shadow: 6px 6px 0 var(--paper); }
.setupbar b { color: var(--saffron); font-weight: 900; font-size: 22px; }
.setupbar .chip { background: transparent; color: var(--paper); border-color: #5A5A5A; font-size: 16px; padding: 2px 10px; }

/* ---------- PHONE ---------- */
.pl { min-height: 100svh; display: flex; flex-direction: column; background: var(--ink); }
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px)); background: var(--ink); color: var(--paper); border-bottom: 3px solid var(--saffron); }
.phead .nm { font-weight: 900; font-size: 22px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phead .meta { font-weight: 700; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.phead .side { font-weight: 900; font-size: 22px; color: var(--saffron); }
.pbody { flex: 1; display: flex; flex-direction: column; }
.card { flex: 1; background: var(--paper); color: var(--ink); padding: 22px max(20px, env(safe-area-inset-right, 0px)) 22px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-weight: 900; font-size: 30px; line-height: 1.4; }
.card .sub { font-weight: 500; font-size: 15px; line-height: 1.6; }
.card input { font-weight: 700; font-size: 22px; padding: 12px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); width: 100%; min-width: 0; }
.card .send { padding: 16px; background: var(--ink); color: var(--saffron); border: 0; box-shadow: 6px 6px 0 var(--saffron); font-weight: 900; font-size: 24px; }
.gpick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gpick .btn { font-size: 22px; font-weight: 900; padding: 14px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cats .btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px; font-size: 16px; box-shadow: 3px 3px 0 var(--ink); }
.cats .btn .pic.flag { width: 52px; height: 39px; border-width: 2px; box-shadow: none; }
.cats .btn img.pic:not(.flag) { width: 40px; height: 40px; }
.cats .btn .emo { font-size: 34px; }
.msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; color: var(--paper); padding: 24px; }
.msg .big { font-weight: 900; font-size: clamp(32px, 10vw, 46px); line-height: 1.4; }
.msg .sub { font-weight: 700; font-size: 17px; line-height: 1.6; color: var(--muted); }
.msg.gold { background: var(--saffron); color: var(--ink); } .msg.gold .sub { color: var(--ink); }
.msg .tclock { font-weight: 900; font-size: 104px; line-height: 1; font-variant-numeric: tabular-nums; }
.msg .badge { padding: 8px 16px; background: var(--saffron); color: var(--ink); font-weight: 900; font-size: 24px; line-height: 1.5; }
.msg .pred { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.msg .pred .btn { font-size: 24px; font-weight: 900; padding: 16px; }
.turn { display: flex; flex-direction: column; flex: 1; background: var(--paper); }
.turn .top { padding: 16px 20px; background: var(--saffron); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.turn .top .t { font-weight: 900; font-size: 84px; line-height: 1; font-variant-numeric: tabular-nums; }
.turn .top .bar { width: 100%; height: 12px; background: rgba(17,17,17,.2); display: flex; }
.turn .top .bar i { display: block; height: 100%; background: var(--ink); }
.turn .top.low .bar i { background: var(--wine); } .turn .top.low .t { color: var(--wine); }
.turn .body { flex: 1; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.turn .picwrap { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #1B1B1B; color: var(--saffron); font-weight: 700; font-size: 16px; text-align: center; }
.turn .picwrap .pbox { flex: none; height: 50vh; height: 50svh; max-height: calc(100vw - 56px); }
.turn .picwrap .sq > .emo { font-size: 30vh; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts .btn { font-size: 17px; font-weight: 900; padding: 12px 8px; box-shadow: 3px 3px 0 var(--ink); }
.opts.three { grid-template-columns: 1fr 1fr 1fr; }
.card h3 { margin: 6px 0 0; font-weight: 900; font-size: 20px; line-height: 1.4; }
.ansrow { display: flex; gap: 10px; }
.ansrow input { flex: 1; min-width: 0; padding: 12px; border: 3px solid var(--ink); font-weight: 700; font-size: 20px; color: var(--ink); background: var(--paper); }
.ansrow button { padding: 12px 16px; background: var(--ink); color: var(--saffron); border: 0; font-weight: 900; font-size: 18px; }
.flash { min-height: 1.6em; font-weight: 900; font-size: 18px; text-align: center; }
.flash.no { color: var(--wine); } .flash.ok { color: var(--green); }
.pass { padding: 14px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font-weight: 900; font-size: 20px; }
.pfoot { display: flex; justify-content: center; padding: 8px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 6px; }
/* no-phone mode */
.modebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.modebar .lab { font-weight: 900; }
.addp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; background: var(--ink); color: var(--paper); box-shadow: 6px 6px 0 var(--paper); }
.addp input { font-weight: 700; font-size: 22px; padding: 8px 12px; border: 3px solid var(--paper); background: var(--paper); color: var(--ink); width: 220px; }
.addp .btn.sel { background: var(--saffron); color: var(--ink); }
.tvpick { display: flex; flex-direction: column; gap: 12px; padding: 18px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); }
.tvpick h3 { margin: 0; font-weight: 900; font-size: 30px; line-height: 1.4; }
.tvpick .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tvpick .grid .btn { font-size: 20px; font-weight: 900; padding: 14px 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.tvpick .grid .btn .pic.flag { width: 40px; height: 30px; border-width: 2px; box-shadow: none; }
.tvpick .grid .btn img.pic:not(.flag) { width: 32px; height: 32px; }
.peek { position: absolute; top: 56px; inset-inline-end: 16px; z-index: 3; padding: 6px 14px; background: var(--ink); color: var(--saffron); border: 2px solid var(--saffron); font-weight: 900; font-size: 22px; }
.bigreveal { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #1B1B1B; }
.bigreveal b { font-weight: 900; font-size: clamp(48px, 7vw, 96px); line-height: 1.3; color: var(--saffron); text-align: center; }
.bigreveal span { font-weight: 700; font-size: 22px; color: var(--paper); }
.dbot .btn.huge { font-size: 26px; font-weight: 900; padding: 12px 28px; }
.dbot .btn.no { background: var(--wine); color: var(--paper); }
.keys { font-weight: 700; font-size: 14px; color: var(--muted); }
.keys kbd { font: inherit; padding: 0 6px; border: 1px solid var(--muted); margin: 0 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
// ======================= shared =======================
const CLOCK_MS = 30000, PASS_MS = 3000;
const TIME_NAME = ms => ms === 60000 ? "دقيقة" : "30 ثانية";
const SB = window.supabase.createClient("https://yewosqrrzxsqwqsicipz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlld29zcXJyenhzcXdxc2ljaXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTc4NDAsImV4cCI6MjEwNjc3Mzg0MH0.P5uF8RCmLht_kQZMp6GNDRmZKAjeFEcYZWkfc-x9iws",
  { auth: { persistSession: false } });
let ch = null, connArgs = null, connOK = false, retryTimer = null;
const EVENTS = ["join", "setup", "pick", "ans", "pass", "pred", "hello", "state"];
function connect(room, key, h) {
  connArgs = [room, key, h];
  const c = SB.channel("mbz-" + room, { config: { broadcast: { self: false }, presence: { key } } });
  ch = c;
  EVENTS.forEach(ev => c.on("broadcast", { event: ev }, m => h.msg(ev, m.payload || {})));
  c.on("presence", { event: "sync" }, () => h.presence && h.presence(c.presenceState()));
  c.subscribe(st => {
    if (c !== ch) return;
    connOK = st === "SUBSCRIBED";
    if (connOK) c.track({ t: Date.now() }).catch(() => {});
    else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") { clearTimeout(retryTimer); retryTimer = setTimeout(reconnect, 2000); }
    h.status(st);

    const nextTxt = nr === 2 ? `الجولة 2 بفئة ${esc(nm(m.b))}: <b>${esc(catById(G.picks[m.b]).name)}</b>` : `تعادل! الجولة الحاسمة بفئة عشوائية`;
    next = `<div class="row" style="gap: 20px;"><span style="font-weight: 700; font-size: 24px; line-height: 1.6;">${nextTxt}</span></div>
      <div class="row"><button type="button" class="btn dark big" data-act="next">${nr === 3 ? "الجولة الحاسمة" : "الجولة الجاية"}</button><button type="button" class="btn" data-act="restart">إعادة المبارزة</button></div>`;
  } else {
    const after = G.queue.filter(x => x !== m.a && x !== m.b)[0];
    const st = G.streak[w] || 0;
    next = `<div class="row" style="gap: 16px;">${st > 1 ? `<span class="chip" style="background: var(--ink); color: var(--saffron);">${st} انتصارات ورا بعض</span>` : ""}
        ${after ? `<span style="font-weight: 700; font-size: 24px;">${esc(nm(w))} ${gx(wg, "بيضل", "بتضل")}، و${esc(nm(after))} ${gx(gOf(after), "جاي يتحدّى", "جاية تتحدّى")}</span>` : ""}</div>
      <div class="row"><button type="button" class="btn dark big" data-act="done">المبارزة الجاية</button><button type="button" class="btn" data-act="restart">إعادة المبارزة</button></div>`;
  }
  $("#app").innerHTML = `<div class="tv dots"><div class="pad res">
    <span class="tag">خلص وقت ${esc(nm(m.lastOut))}${m.reveal ? ` · الجواب كان «${esc(m.reveal)}»` : ""}</span>
    <h2 class="extrude">${esc(nm(w))} ${m.phase === "matchEnd" ? gx(wg, "ربح المبارزة!", "ربحت المبارزة!") : gx(wg, "ربح الجولة!", "ربحت الجولة!")}</h2>
    <div class="score">${box(m.a)}<span style="font-weight: 900; font-size: 48px;">–</span>${box(m.b)}</div>
    ${next}
  </div></div>`;
}
function hostClick(e) {
  const rm = e.target.closest("[data-rm]");
  if (rm) { const p = rm.dataset.rm; G.players = G.players.filter(x => x.pid !== p); G.queue = G.queue.filter(x => x !== p); delete G.picks[p]; delete G.setup[p]; saveG(); renderHost(); return pub(); }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, m = M();
  if (a === "restart" || a === "reset") {
    if (!b.dataset.sure) {
      b.dataset.sure = "1"; const was = b.textContent; b.textContent = a === "reset" ? "بتمسح كل شي؟ اضغط كمان مرة" : "متأكد؟ اضغط كمان مرة";
      setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = was; } }, 3000); return;
    }
    tvSel = { theme: null, diff: null };
    if (a === "restart") { G.match = null; }   // players, line, theme and categories stay
    else { G.players = []; G.queue = []; clearSetup(); G.match = null; G.streak = {}; G.stars = {}; }
    saveG(); renderHost(); return pub();
  }
  if (a === "phones") { if (!m || m.phase === "lobby") { G.noPhones = b.dataset.v === "1"; saveG(); renderHost(); pub(); } return; }
  if (a === "judge") { G.judge = b.dataset.v === "reveal" ? "reveal" : "host"; saveG(); renderHost(); return; }
  if (a === "newg") { newG = b.dataset.v === "f" ? "f" : "m"; document.querySelectorAll('[data-act="newg"]').forEach(x => { x.classList.toggle("sel", x === b); x.setAttribute("aria-pressed", String(x === b)); }); const i = document.getElementById("np-name"); if (i) i.focus(); return; }
  if (a === "tvtheme" || a === "tvdiff") { tvSel[a === "tvtheme" ? "theme" : "diff"] = b.dataset.v; return renderLobby(); }
  if (a === "tvok") { const t = tvSel; tvSel = { theme: null, diff: null }; return doSetup(b.dataset.p, t.theme, t.diff, true); }
  if (a === "tvpick") return doPick(b.dataset.p, b.dataset.v);
  if (a === "clock") { if (!m || m.phase === "lobby") { G.clockMs = b.dataset.ms === "60000" ? 60000 : 30000; saveG(); renderHost(); pub(); } return; }
  if (a === "start") return startMatch();
  if (a === "randomize") return G.offer ? randomizePicks() : randomizeSetup();
  if (a === "newtheme") { if (!m || m.phase === "lobby") { clearSetup(); saveG(); renderHost(); pub(); } return; }
  if (a === "next") return nextRound();
  if (a === "done") return endMatch();
  if (!m || m.phase !== "duel") return;
  if (m.revealing) { if (a === "right") judgeReveal(true); if (a === "wrong") judgeReveal(false); return; }
  if (a === "reveal") { if (m.running) revealNow(); return; }
  if (a === "pause") { m.running = !m.running; m.lastTick = Date.now(); saveG(); renderDuel(); return pub(); }
  if (!m.running) return;
  if (a === "right") answer("", true);
  if (a === "badpic") badPicture();
  if (a === "pass") doPass();
}

// ======================= PHONE =======================
const PKEY = "mbz-player-v1";
let P, S = null, lastState = 0, stateAt = 0, lastView = "", pickG = null, editing = false, selTheme = null, selDiff = null;
const me = () => S && S.players.find(x => x.pid === P.pid);
const spName = pid => ((S && S.players.find(x => x.pid === pid)) || {}).name || "";
const spG = pid => ((S && S.players.find(x => x.pid === pid)) || {}).g || "m";
const myG = () => P.g === "f" ? "f" : "m";
const inMatch = () => S && S.a && (S.a === P.pid || S.b === P.pid);
const opp = () => S.a === P.pid ? S.b : S.a;

function initPlayer() {
  P = store.get(PKEY) || {}; if (!P.pid) P.pid = rid(); store.set(PKEY, P);
  $("#app").innerHTML = `<div class="pl"><div class="phead" id="phead"></div><div class="pbody" id="pbody"></div><div class="pfoot" id="pfoot"></div></div>`;
  document.addEventListener("submit", onSubmit);
  document.addEventListener("click", onTap);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && ch && Date.now() - lastState > 4000) reconnect(); });
  if (roomParam.length === 4) connect(roomParam, P.pid, {
    msg: (ev, p) => {
      if (ev !== "state") return;
      const wasMine = S && S.phase === "duel" && S.turn === P.pid;
      S = p; lastState = stateAt = Date.now();
      if (!me() && P.name && P.g && !editing) send("join", { pid: P.pid, name: P.name, g: P.g });
      const mineNow = S.phase === "duel" && S.turn === P.pid;
      if (mineNow && !wasMine && navigator.vibrate) navigator.vibrate(80);
      render();
    },
    status: st => { if (st === "SUBSCRIBED") { if (P.name && P.g) send("join", { pid: P.pid, name: P.name, g: P.g }); send("hello", {}); } render(); }
  });
  render(); setInterval(render, 1000); setInterval(paintMine, 100);
}

function onSubmit(e) {
  const f = e.target.closest("form[data-f]"); if (!f) return; e.preventDefault();
  const kind = f.dataset.f, inp = f.querySelector("input"), err = f.querySelector(".err"), v = inp ? inp.value.trim() : "";
  if (kind === "code") { const c = v.toUpperCase().replace(/[^A-Z]/g, ""); if (c.length !== 4) { err.textContent = "الرمز من 4 أحرف إنجليزية، مثل ABCD."; return; } location.search = "?room=" + c; return; }
  if (kind === "name") {
    if (!v) { err.textContent = "اكتب اسمك."; return; }
    if (!pickG) { err.textContent = "اختار لاعب أو لاعبة."; return; }
    P.name = v.slice(0, 24); P.g = pickG; store.set(PKEY, P); editing = false;
    send("join", { pid: P.pid, name: P.name, g: P.g }); lastView = ""; render(); return;
  }
  if (kind === "ans") { if (!v) return; send("ans", { pid: P.pid, text: v }); inp.value = ""; inp.focus(); }
}
function onTap(e) {
  const g = e.target.closest("[data-g]");
  if (g) { pickG = g.dataset.g; document.querySelectorAll("[data-g]").forEach(x => { x.classList.toggle("sel", x === g); x.setAttribute("aria-pressed", String(x === g)); }); }
  const c = e.target.closest("[data-cat]"); if (c && !c.disabled) { send("pick", { pid: P.pid, cat: c.dataset.cat }); c.classList.add("sel"); }
  const pr = e.target.closest("[data-pred]"); if (pr) { send("pred", { pid: P.pid, who: pr.dataset.pred }); pr.classList.add("sel"); }
  if (e.target.closest("#passBtn")) send("pass", { pid: P.pid });
  const th = e.target.closest("[data-theme]"); if (th) { selTheme = th.dataset.theme; sendSetup(false); }
  const df = e.target.closest("[data-diff]"); if (df) { selDiff = df.dataset.diff; sendSetup(false); }
  if (e.target.closest("#setupOk") && selTheme && selDiff) sendSetup(true);
  if (e.target.closest("#setupEdit")) sendSetup(false);
  if (e.target.closest("#rename")) { editing = true; pickG = P.g; lastView = ""; render(); }
}

// Theme and difficulty choices go to the TV as they're made; تمام locks them in
function sendSetup(ok) { send("setup", { pid: P.pid, theme: selTheme, diff: selDiff, ok }); if (S && S.setup) S.setup[P.pid] = { theme: selTheme, diff: selDiff, ok }; lastView = ""; render(); }
function setupView() {
  const g = myG(), mine = (S.setup || {})[P.pid] || {};
  if (selTheme === null && mine.theme) selTheme = mine.theme;
  if (selDiff === null && mine.diff) selDiff = mine.diff;
  const oppId = S.queue[S.queue.indexOf(P.pid) === 0 ? 1 : 0];
  if (mine.ok) {
    const os = (S.setup || {})[oppId];
    return `<div class="msg"><div class="big">${gx(g, "تمام!", "تمام!")}</div>
      <span class="badge">${esc(THEME_NAME(mine.theme))} · ${DIFF_NAME[mine.diff]}</span>
      <div class="sub">${oppId ? (os && os.ok ? "" : `بنستنى ${esc(spName(oppId))}…`) : "بنستنى خصم…"}<br>إذا اختلفتوا، القرعة بتقرّر</div>
      <button type="button" class="btn" id="setupEdit">${gx(g, "غيّر اختيارك", "غيّري اختيارك")}</button></div>`;
  }
  return `<div class="card"><h2>${gx(g, "اختار الموضوع", "اختاري الموضوع")}</h2>
    <div class="sub">الفئات رح تطلع من الموضوع اللي بتختاروه. الوقت: ${TIME_NAME(S.clockMs)} لكل لاعب.</div>
    <div class="opts">${DUEL_THEMES.map(t => `<button type="button" class="btn ${selTheme === t.id ? "sel" : ""}" data-theme="${t.id}" aria-pressed="${selTheme === t.id}">${esc(t.name)}</button>`).join("")}</div>
    <h3>الصعوبة</h3>
    <div class="sub">من وين نبلّش؟ الأسئلة بتصعب مع الوقت.</div>
    <div class="opts three">${["e", "m", "h"].map(d => `<button type="button" class="btn ${selDiff === d ? "sel" : ""}" data-diff="${d}" aria-pressed="${selDiff === d}">${DIFF_NAME[d]}</button>`).join("")}</div>
    <button type="button" class="send" id="setupOk" ${selTheme && selDiff ? "" : "disabled"} style="margin-top: 8px;">تمام</button>
  </div>`;
}

// Local countdown between updates so the clock on the phone moves smoothly
function myClockMs(pid) { if (!S || !S.clocks) return 0; let ms = S.clocks[pid]; if (S.phase === "duel" && S.running && S.turn === pid) ms -= Date.now() - stateAt; return ms; }
function paintMine() {
  document.querySelectorAll("[data-clock]").forEach(el => {
    const ms = myClockMs(el.dataset.clock);
    const t = el.querySelector(".t"), b = el.querySelector(".bar i");
    if (t) t.textContent = secs(ms);
    if (b) b.style.width = (100 * Math.max(0, ms) / ((S && S.clockMs) || CLOCK_MS)) + "%";
    el.classList.toggle("low", ms < 10000);
  });
}

function catPicker(locked) {
  const pos = S.queue.indexOf(P.pid), oppId = pos === 0 ? S.queue[1] : pos === 1 ? S.queue[0] : null;
  const oppPick = oppId ? (S.players.find(x => x.pid === oppId) || {}).pick : null;
  const mine = (me() || {}).pick, g = myG();
  const draw = S.draw ? [S.draw.tBy && "الموضوع", S.draw.dBy && "الصعوبة"].filter(Boolean).join(" و") : "";
  return `<div class="card"><h2>${gx(g, "اختار فئتك", "اختاري فئتك")}</h2>
    <div class="sub"><b>${esc(THEME_NAME(S.theme))} · ${DIFF_NAME[S.diff]}</b>${draw ? ` (${draw} بالقرعة)` : ""}. جولة كاملة رح تكون بفئتك.</div>
    <div class="cats"><button type="button" class="btn ${mine === "random" ? "sel" : ""}" data-cat="random" style="grid-column: 1 / -1;"><span class="pthumb" style="font-size: 22px;">؟</span>${gx(g, "فاجئني: فئة عشوائية", "فاجئيني: فئة عشوائية")}</button>${S.offer.map(catById).map(c => `<button type="button" class="btn ${mine === c.id ? "sel" : ""}" data-cat="${c.id}" ${(oppPick === c.id || locked) ? "disabled" : ""}>${catThumb(c)}${esc(c.name)}</button>`).join("")}</div>
    ${oppPick && oppPick !== "random" ? `<div class="sub" style="font-weight: 700;">${gx(g, "ما بتقدر تختار", "ما بتقدري تختاري")} فئة ${esc(spName(oppId))} (${esc(catById(oppPick).name)})</div>` : ""}
  </div>`;
}

function render() {
  if (!P) return;
  const head = $("#phead"), body = $("#pbody"), foot = $("#pfoot");
  const live = S && Date.now() - lastState < 7000, m = me(), g = myG();
  const joined = P.name && P.g && roomParam.length === 4 && !editing;
  head.innerHTML = joined
    ? `<div style="min-width: 0;"><div class="nm">${esc(P.name)}</div><div class="meta"><span class="dot ${live ? "on" : ""}"></span>${live ? gx(g, "متصل", "متصلة") + " · " + roomParam : "بانتظار الشاشة…"}${m && m.stars ? ` · ★${m.stars}` : ""}</div></div>
       <div class="side">${S && S.score && inMatch() ? `${S.score[P.pid]}–${S.score[opp()]}` : ""}</div>`
    : `<div class="nm" style="color: var(--saffron);">مبارزة</div>`;

  let key, html;
  if (roomParam.length !== 4) {
    key = "code"; html = `<form class="card" data-f="code"><h2>ادخل على المبارزة</h2><label for="f-code" style="font-weight: 700;">رمز الغرفة الظاهر على الشاشة</label><input id="f-code" maxlength="4" dir="ltr" autocapitalize="characters" placeholder="ABCD"><p class="err"></p><button class="send" type="submit">التالي</button></form>`;
  } else if (!joined) {
    const gp = pickG || P.g;
    key = "name"; html = `<form class="card" data-f="name" autocomplete="off"><h2>ما اسمك؟</h2><label for="f-name" style="font-weight: 700;">اسمك مبيّن على الشاشة</label>
      <input id="f-name" maxlength="24" value="${esc(P.name || "")}" placeholder="مثلًا: علي">
      <div style="font-weight: 700;">أنا</div><div class="gpick"><button type="button" class="btn ${gp === "m" ? "sel" : ""}" data-g="m" aria-pressed="${gp === "m"}">لاعب</button><button type="button" class="btn ${gp === "f" ? "sel" : ""}" data-g="f" aria-pressed="${gp === "f"}">لاعبة</button></div>
      <p class="err"></p><button class="send" type="submit">دخّلني!</button></form>`;
  } else if (!live) {
    key = "off"; html = `<div class="msg"><div class="big">بانتظار الشاشة…</div><div class="sub">تأكد إن شاشة المبارزة مفتوحة</div></div>`;
  } else if (S.phase === "loading") {
    key = "loading"; html = `<div class="msg"><div class="big">${esc(catById(S.cat).name)}</div><div class="sub">عم نحمّل الصور…</div></div>`;
  } else if (S.phase === "duel" || S.phase === "count") {
    if (inMatch()) {
      if (S.phase === "duel" && S.turn === P.pid && S.running) {
        key = "turn" + S.pic;
        html = `<div class="turn"><div class="top" data-clock="${P.pid}"><span style="font-weight: 700;">دورك!</span><span class="t ltr"></span><div class="bar"><i></i></div></div>
          <div class="body">
            <div class="picwrap"><div class="pbox"><div class="sq">${picHTML(S.kind, S.pic)}</div></div><span>${esc(S.prompt)}</span></div>
            <form class="ansrow" data-f="ans" autocomplete="off"><label for="f-ans" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">الجواب</label><input id="f-ans" placeholder="اكتب الجواب (عربي أو English)"><button type="submit">إبعت</button></form>
            <div class="flash ${S.last && S.last.pid === P.pid ? S.last.v : ""}">${S.last && S.last.pid === P.pid && S.last.v === "no" ? "✗ «" + esc(S.last.text) + "» غلط، جرّب كمان" : ""}</div>
            <button type="button" class="pass" id="passBtn">مرّر · −3 ثواني</button>
          </div></div>`;
      } else {
        const og = spG(opp());
        key = "wait" + S.phase + S.running;
        html = `<div class="msg" data-clock="${P.pid}"><span class="sub">${S.phase === "count" ? "استعد…" : !S.running ? "اللعب واقف" : "وقتك واقف"}</span><span class="tclock t ltr"></span>
          <div class="bar" style="width: 100%; height: 12px; background: var(--grey2); display: flex;"><i style="display: block; height: 100%; background: var(--muted);"></i></div>
          <span class="badge">${S.phase === "count" ? esc(catById(S.cat).name) : "دور " + esc(spName(opp()))}</span>
          <span class="sub">${gx(g, "جهّز حالك، الصورة الجاية إلك", "جهّزي حالك، الصورة الجاية إلك")}</span></div>`;
      }
    } else {
      key = "watch" + (S.preds && S.preds[P.pid]);
      html = predView(g);
    }
  } else if (S.phase === "roundEnd" || S.phase === "matchEnd") {
    const w = S.phase === "matchEnd" ? S.winner : S.roundWinner, won = w === P.pid;
    key = "res" + S.phase + w;
    if (inMatch()) html = `<div class="msg ${won ? "gold" : ""}"><div class="big">${won ? (S.phase === "matchEnd" ? gx(g, "ربحت المبارزة!", "ربحتي المبارزة!") : gx(g, "ربحت الجولة!", "ربحتي الجولة!")) : (S.phase === "matchEnd" ? gx(g, "خسرت المبارزة", "خسرتي المبارزة") : gx(g, "خسرت الجولة", "خسرتي الجولة"))}</div>
      <div class="sub">${S.phase === "matchEnd" ? (won ? gx(g, "إنت بتضل، وبتختار موضوع وفئة من جديد", "إنتي بتضلي، وبتختاري موضوع وفئة من جديد") : gx(g, "رجعت عالدور", "رجعتي عالدور")) : "الجولة الجاية قريبًا"}</div></div>`;
    else html = `<div class="msg"><div class="big">${esc(spName(w))} ${S.phase === "matchEnd" ? gx(spG(w), "ربح المبارزة", "ربحت المبارزة") : gx(spG(w), "ربح الجولة", "ربحت الجولة")}</div>
      ${S.phase === "matchEnd" && S.preds && S.preds[P.pid] ? `<div class="sub">${S.preds[P.pid] === w ? "توقّعك صح! ★" : "توقّعك ما زبط"}</div>` : ""}</div>`;
  } else {
    // lobby: the two at the front of the line choose a theme and difficulty, then a category each; everyone else waits
    const pos = S.queue.indexOf(P.pid);
    if (pos <= 1 && pos >= 0 && !S.offer) { key = "setup" + JSON.stringify(S.setup || {}) + S.queue.slice(0, 2); html = setupView(); }
    else if (pos <= 1 && pos >= 0) { selTheme = selDiff = null; key = "pick" + (m && m.pick) + JSON.stringify(S.players.map(p => p.pick)) + S.offer; html = catPicker(false); }
    else { selTheme = selDiff = null; key = "queue" + pos; html = `<div class="msg"><div class="big">${gx(g, "إنت بالدور", "إنتي بالدور")}</div><div class="sub">قدّامك ${Math.max(0, pos - 1)} ${pos - 1 === 1 ? "لاعب" : "لاعبين"}</div>${S.offer ? `<span class="badge">${esc(THEME_NAME(S.theme))} · ${DIFF_NAME[S.diff]}</span>` : ""}<div class="sub">لما تبلّش المبارزة ${gx(g, "بتقدر تتوقّع", "بتقدري تتوقّعي")} مين رح يربح</div></div>`; }
  }
  const isForm = key === "code" || key === "name" || key.startsWith("turn");
  if (key !== lastView || !isForm) { body.innerHTML = html; if (key.startsWith("turn") && key !== lastView) { const i = $("#f-ans"); if (i) i.focus(); } }
  else if (key.startsWith("turn")) { const fl = body.querySelector(".flash"); if (fl) { const tmp = document.createElement("div"); tmp.innerHTML = html; const nf = tmp.querySelector(".flash"); fl.className = nf.className; fl.innerHTML = nf.innerHTML; } }
  lastView = key;
  foot.innerHTML = joined ? `<button type="button" class="linkbtn" id="rename">تغيير الاسم</button>` : "";
  paintMine();
}
function predView(g) {
  const mine = S.preds && S.preds[P.pid];
  return `<div class="msg"><span class="sub">${esc(spName(S.a))} ضد ${esc(spName(S.b))} · ${esc(catById(S.cat).name)}</span>
    <div class="big">مين رح يربح؟</div>
    <div class="pred">${[S.a, S.b].map(p => `<button type="button" class="btn ${mine === p ? "sel" : ""}" data-pred="${p}">${esc(spName(p))}${mine === p ? " ✓" : ""}</button>`).join("")}</div>
    <span class="sub">${gx(g, "التوقّع الصح بيعطيك نجمة", "التوقّع الصح بيعطيكي نجمة")}</span></div>`;
}

if (IS_PLAYER) initPlayer(); else initHost();
</script>
