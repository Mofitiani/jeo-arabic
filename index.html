<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>جيو!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;900&display=swap">
<style>
/* Saffron poster with depth: hard offset shadows, halftone dots, extruded type. TV = host screen, phone = one big slab per state. */
:root {
  --saffron: #F2B705; --saffron-deep: #6B5200; --ink: #111111; --paper: #FFFFFF;
  --grey: #2A2A2A; --grey2: #3A3A3A; --muted: #CFCFCF;
  --red: #D62828; --wine: #B3261E; --green: #1F7A4D; --focus: #1F4FB3;
  --font: "Alexandria", Tahoma, "Noto Sans Arabic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--ink); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; }
[hidden] { display: none !important; }
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.dots { background-color: var(--saffron); background-image: radial-gradient(rgba(17,17,17,.13) 1.3px, transparent 1.8px); background-size: 9px 9px; }
.dots-dark { background-color: var(--ink); background-image: radial-gradient(rgba(242,183,5,.10) 1.3px, transparent 1.8px); background-size: 9px 9px; color: var(--paper); }
.extrude { text-shadow: 5px 5px 0 var(--paper), 10px 10px 0 var(--ink); }
.extrude-dark { text-shadow: 6px 6px 0 var(--saffron-deep); }
.ltr { direction: ltr; unicode-bidi: isolate; }

/* Buttons */
.btn { font-weight: 700; font-size: 16px; line-height: 1.4; padding: 10px 18px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); transition: transform .06s, box-shadow .06s; }
.btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.btn.dark { background: var(--ink); color: var(--saffron); box-shadow: 4px 4px 0 var(--paper); }
.btn.gold { background: var(--saffron); color: var(--ink); }
.btn.ok { background: var(--green); color: var(--paper); }
.btn.no { background: var(--wine); color: var(--paper); }
.btn.big { font-size: 24px; font-weight: 900; padding: 14px 28px; }
.btn.sm { font-size: 14px; padding: 6px 12px; box-shadow: 3px 3px 0 var(--ink); }
.btn.ghost { background: transparent; color: inherit; border-color: currentColor; box-shadow: none; }
.btn.sel { background: var(--ink); color: var(--saffron); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.err { color: var(--wine); font-weight: 700; font-size: 15px; margin: 0; min-height: 1.6em; }

/* ---------------- HOST: board ---------------- */
.host { min-height: 100vh; padding: 32px max(24px, env(safe-area-inset-right, 0px)) 40px max(24px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 24px; }
.hhead { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.hhead h1 { margin: 0; font-weight: 900; font-size: clamp(44px, 6vw, 84px); line-height: 1.3; }
.hside { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.codechip { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--ink); color: var(--saffron); box-shadow: 6px 6px 0 var(--paper); border: 0; }
.codechip .lbl { font-weight: 700; font-size: 13px; color: var(--paper); line-height: 1.5; }
.codechip .code { font-weight: 900; font-size: 32px; letter-spacing: .08em; line-height: 1; }
.qrbox { background: var(--paper); padding: 4px; line-height: 0; }
.qrbox img, .qrbox canvas { display: block; width: 100%; height: auto; }
.conn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wine); flex: none; display: inline-block; }
.dot.on { background: #3FBF7F; }
.board-scroll { overflow-x: auto; padding: 0 0 10px 10px; flex: 1; display: flex; }
.board { flex: 1; min-width: 900px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: auto; gap: 16px; }
.cat { display: flex; align-items: flex-end; padding: 12px 14px 14px; min-height: 80px; background: var(--ink); color: var(--saffron); font-weight: 900; font-size: 19px; line-height: 1.5; box-shadow: 6px 6px 0 var(--paper); }
.tile { min-height: 84px; border: 3px solid var(--ink); background: var(--paper); box-shadow: 6px 6px 0 var(--ink); font-weight: 900; font-size: clamp(30px, 3vw, 44px); color: var(--ink); line-height: 1.3; transition: transform .08s, box-shadow .08s; }
.tile:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
.tile:disabled { cursor: default; color: transparent; border-color: rgba(17,17,17,.28); box-shadow: none; transform: translate(3px, 3px); background: repeating-linear-gradient(135deg, rgba(17,17,17,.10) 0 3px, transparent 3px 11px); }
.leader { display: flex; gap: 16px; flex-wrap: wrap; }
.pc { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
.pc .rank { display: grid; place-items: center; width: 40px; height: 40px; flex: none; background: var(--ink); color: var(--saffron); font-weight: 900; font-size: 22px; }
.pc .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 19px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc .nm small { display: block; font-size: 12px; font-weight: 700; color: var(--saffron-deep); }
.pc .delta { padding: 2px 8px; font-weight: 900; font-size: 15px; color: var(--paper); background: #555; }
.pc .delta.up { background: var(--green); } .pc .delta.down { background: var(--wine); }
.pc .sc { font-weight: 900; font-size: 32px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.pc .sc.neg { color: var(--wine); }
.pc .ctl { display: flex; flex-direction: column; gap: 4px; opacity: .25; transition: opacity .15s; }
.pc:hover .ctl, .pc:focus-within .ctl { opacity: 1; }
.pc .ctl button { font-size: 12px; font-weight: 700; padding: 2px 6px; border: 2px solid var(--ink); background: var(--paper); line-height: 1.4; }
.emptycard { flex: 1; padding: 14px 18px; border: 3px dashed var(--ink); font-weight: 700; line-height: 1.6; }

/* ---------------- HOST: full-screen overlays ---------------- */
.ov { position: fixed; inset: 0; z-index: 20; overflow-y: auto; display: flex; flex-direction: column; }
.scr { flex: 1; display: flex; flex-direction: column; min-height: 100%; }
.pad { padding: 48px max(32px, env(safe-area-inset-right, 0px)) 40px max(32px, env(safe-area-inset-left, 0px)); }
.chip { padding: 8px 18px; background: var(--ink); color: var(--saffron); font-weight: 900; font-size: 22px; line-height: 1.5; box-shadow: 6px 6px 0 var(--paper); }
.vchip { padding: 4px 18px; background: var(--paper); border: 3px solid var(--ink); font-weight: 900; font-size: 36px; line-height: 1.3; box-shadow: 6px 6px 0 var(--ink); }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 64px; }
.lobby h1 { margin: 0; font-weight: 900; font-size: clamp(64px, 9vw, 136px); line-height: 1.3; }
.lobby .bigcode { align-self: flex-end; font-weight: 900; font-size: clamp(96px, 12vw, 176px); line-height: 1; letter-spacing: .06em; text-shadow: 8px 8px 0 var(--paper); }
.lobby .qrbig { align-self: center; padding: 18px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 12px 12px 0 var(--ink); width: min(340px, 100%); }
.sticker { padding: 10px 22px; font-weight: 900; font-size: 24px; line-height: 1.5; background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
.sticker.new { background: var(--ink); color: var(--saffron); }
.sticker small { font-size: 14px; font-weight: 700; margin-inline-start: 8px; }
.waitchip { padding: 10px 22px; font-weight: 700; font-size: 18px; border: 3px dashed var(--ink); line-height: 1.5; }
@media (max-width: 900px) { .lobby { grid-template-columns: 1fr; gap: 32px; } }

/* clue */
.cluetop { flex: 1; display: flex; flex-direction: column; gap: 32px; }
.cluetxt { margin: 0; max-width: 1180px; font-weight: 900; font-size: clamp(34px, 4.4vw, 60px); line-height: 1.65; text-wrap: balance; }
.tries { display: flex; gap: 12px; flex-wrap: wrap; }
.try { display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: var(--paper); border: 3px solid var(--ink); font-weight: 700; font-size: 17px; line-height: 1.5; }
.try .v { padding: 2px 8px; font-weight: 900; color: var(--paper); background: #555; }
.try .v.right { background: var(--green); } .try .v.wrong, .try .v.none { background: var(--wine); }
.bar { background: var(--ink); color: var(--paper); box-shadow: 0 -10px 0 rgba(17,17,17,.25); padding: 24px max(32px, env(safe-area-inset-right, 0px)) 32px max(32px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.bar .who { font-weight: 900; font-size: clamp(44px, 5vw, 72px); line-height: 1.3; color: var(--saffron); text-shadow: 5px 5px 0 var(--saffron-deep); }
.bar .what { font-weight: 700; font-size: 24px; line-height: 1.5; }
.bar .hint { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0; }
.bar .live { font-weight: 900; font-size: 40px; line-height: 1.3; color: var(--saffron); animation: blink 1s ease-in-out infinite; }
.bar .ans { font-weight: 900; font-size: clamp(30px, 3.6vw, 48px); line-height: 1.4; color: var(--saffron); }
.bar .lbl { font-weight: 700; font-size: 15px; color: var(--muted); }
.drain { display: flex; align-items: center; gap: 18px; }
.drain .track { flex: 1; height: 22px; background: var(--grey2); }
.drain .fill { height: 100%; background: var(--saffron); width: 100%; }
.drain .secs { font-weight: 900; font-size: 28px; color: var(--saffron); min-width: 3.5em; }
.bar .btn.ghost { color: var(--paper); }
@keyframes blink { 50% { opacity: .45; } }

/* buzz flash */
.flash { flex: 1; border: 28px solid var(--saffron); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 24px; }
.flash .t { font-weight: 700; font-size: 34px; line-height: 1.5; }
.flash .n { font-weight: 900; font-size: clamp(110px, 18vw, 260px); line-height: 1.3; color: var(--saffron); text-shadow: 10px 10px 0 var(--saffron-deep), 20px 20px 0 var(--paper); }
.flash .c { padding: 12px 24px; border: 3px solid var(--saffron); color: var(--saffron); font-weight: 700; font-size: 24px; line-height: 1.5; }

/* wager */
.hatch { background: repeating-linear-gradient(135deg, var(--ink) 0 46px, var(--saffron) 46px 92px); display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.wcard { width: min(820px, 100%); padding: 48px clamp(20px, 5vw, 56px); display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; background: var(--paper); border: 6px solid var(--ink); box-shadow: 18px 18px 0 var(--ink); }
.wcard .big { font-weight: 900; font-size: clamp(90px, 13vw, 190px); line-height: 1.3; text-shadow: 8px 8px 0 var(--saffron); }
.wcard .line { font-weight: 700; font-size: 28px; line-height: 1.6; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; width: 100%; text-align: start; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 15px; line-height: 1.5; }
.field input, .field select { font-weight: 700; font-size: 22px; padding: 12px 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); width: 100%; }

/* final */
.final h2 { margin: 0; font-weight: 900; font-size: clamp(64px, 9vw, 136px); line-height: 1.3; color: var(--saffron); }
.final .cluetxt { color: var(--saffron); }
.fcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.fcard { display: flex; flex-direction: column; gap: 8px; padding: 20px 24px; background: #1C1C1C; border: 3px solid #4A4A4A; box-shadow: 8px 8px 0 #000; color: var(--paper); }
.fcard.done { border-color: var(--saffron); box-shadow: 8px 8px 0 var(--saffron); }
.fcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.fcard .n { font-weight: 900; font-size: 28px; line-height: 1.4; }
.fcard .s { font-weight: 900; font-size: 24px; color: var(--saffron); }
.fcard .st { font-weight: 700; font-size: 19px; line-height: 1.5; color: var(--muted); }
.fcard.done .st { color: var(--saffron); }
.fcard .said { font-weight: 700; font-size: 20px; color: var(--paper); line-height: 1.6; }
.fbtns .btn.ghost { color: var(--paper); }

/* results */
.results { display: flex; flex-direction: column; gap: 24px; }
.results h2 { margin: 0; font-weight: 900; font-size: clamp(56px, 8vw, 110px); line-height: 1.3; }
.rlist { display: flex; flex-direction: column; gap: 12px; max-width: 760px; }

/* ---------------- PHONE ---------------- */
.pl { min-height: 100svh; display: flex; flex-direction: column; background: var(--ink); }
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px)); background: var(--ink); color: var(--paper); border-bottom: 3px solid var(--saffron); }
.phead .nm { font-weight: 900; font-size: 22px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phead .sc { font-weight: 900; font-size: 38px; line-height: 1.2; color: var(--saffron); font-variant-numeric: tabular-nums; }
.phead .sc.neg { color: #FF8A80; }
.pbody { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.pmeta { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 15px; line-height: 1.5; color: var(--paper); }
.slab { flex: 1; min-height: 360px; width: 100%; border: 4px solid var(--ink); padding: 22px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: right; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; transition: transform .05s, box-shadow .05s; }
.slab .tag { font-weight: 700; font-size: 17px; line-height: 1.5; padding: 6px 12px; background: var(--ink); color: var(--saffron); }
.slab .big { font-weight: 900; font-size: clamp(64px, 24vw, 116px); line-height: 1.3; }
.slab.s-idle, .slab.s-wait { background: var(--grey2); color: var(--muted); box-shadow: 8px 8px 0 #000; }
.slab.s-wait .tag, .slab.s-idle .tag { color: var(--muted); }
.slab.s-ready { background: var(--saffron); color: var(--ink); box-shadow: 10px 10px 0 var(--paper); animation: pulse .9s ease-in-out infinite; }
.slab.s-ready:active { transform: translate(6px, 6px); box-shadow: 4px 4px 0 var(--paper); }
.slab.s-pending { background: #B8941F; color: var(--ink); }
.slab.s-early { background: var(--red); color: var(--paper); transform: translate(6px, 6px); }
.slab.s-early .tag { color: var(--paper); }
.slab.s-win { background: var(--paper); color: var(--ink); }
.slab.s-beaten { background: var(--grey); color: var(--paper); }
.slab.s-beaten .tag { background: var(--saffron); color: var(--ink); }
.slab.s-locked { background: repeating-linear-gradient(135deg, var(--wine) 0 18px, #8E1E18 18px 36px); color: var(--paper); transform: translate(6px, 6px); }
.slab.s-locked .tag { background: var(--paper); color: var(--wine); }
.slab.s-off { background: var(--grey); color: var(--muted); }
@keyframes pulse { 50% { box-shadow: 10px 10px 0 var(--paper), 0 0 0 14px rgba(242,183,5,.25); } }
.pcard { flex: 1; background: var(--paper); color: var(--ink); padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
.pcard h2 { margin: 0; font-weight: 900; font-size: 32px; line-height: 1.4; }
.pcard .sub { font-weight: 700; font-size: 15px; line-height: 1.5; display: flex; justify-content: space-between; gap: 12px; }
.pcard input { font-weight: 700; font-size: 24px; padding: 14px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); width: 100%; }
.pcard .send { padding: 16px; background: var(--ink); color: var(--saffron); border: 0; box-shadow: 6px 6px 0 var(--saffron); font-weight: 900; font-size: 24px; }
.ptrack { height: 14px; background: #D9D9D9; border: 2px solid var(--ink); }
.ptrack .fill { height: 100%; background: var(--saffron); width: 100%; }
.gpick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gpick .btn { font-size: 22px; font-weight: 900; padding: 14px; }
.msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; color: var(--paper); padding: 24px; }
.msg .big { font-weight: 900; font-size: clamp(34px, 10vw, 48px); line-height: 1.4; }
.msg .sub { font-weight: 700; font-size: 17px; line-height: 1.6; color: var(--muted); }
.msg .num { font-weight: 900; font-size: 56px; line-height: 1.3; }
.msg.ok .big, .msg.ok .num { color: #7FD1A0; } .msg.bad .big, .msg.bad .num { color: #FF8A80; }
.claims { display: flex; flex-direction: column; gap: 10px; }
.claims .row { justify-content: flex-start; }
.pfoot { display: flex; justify-content: center; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 6px; }
@media (prefers-reduced-motion: reduce) { .slab.s-ready, .bar .live { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="overlay" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const VALUES = [200, 400, 600, 800, 1000];
const CATS = [
  { name: "كلمات عربية في الإنجليزية", clues: [
    ["كلمة إنجليزية لفرع من الرياضيات، أُخذت من عنوان كتاب الخوارزمي في «الجبر والمقابلة».", "ما هي Algebra؟"],
    ["أصلها «الكُحل»، المسحوق الناعم لتكحيل العيون، ثم صارت تعني في الإنجليزية المادة المُسكِرة.", "ما هي Alcohol؟"],
    ["رتبة بحرية رفيعة في الإنجليزية، يُرجَّح أنها مأخوذة من لقب «أمير البحر».", "ما هي Admiral؟"],
    ["أعطت كلمة «صِفر» العربية الإنجليزيةَ كلمة zero، وأعطتها أيضًا هذه الكلمة التي تعني الرمز أو الشيفرة.", "ما هي Cipher؟"],
    ["من الكلمة العربية «تعريف»، وصارت تعني في الإنجليزية جدول الرسوم الجمركية.", "ما هي Tariff؟"]
  ]},
  { name: "علماء العصر الذهبي", clues: [
    ["من اسمه اشتُقّت كلمة «خوارزمية».", "من هو الخوارزمي؟"],
    ["مؤلف «القانون في الطب» الذي دُرِّس في جامعات أوروبا قرونًا.", "من هو ابن سينا؟"],
    ["عالم من البصرة شرح في «كتاب المناظر» أن الرؤية تحدث بدخول الضوء إلى العين.", "من هو ابن الهيثم؟"],
    ["جرّاح أندلسي وضع موسوعة «التصريف لمن عجز عن التأليف» ورسم فيها أدوات الجراحة.", "من هو الزهراوي؟"],
    ["طبيب دمشقي وصف الدورة الدموية الصغرى بين القلب والرئتين في القرن الثالث عشر.", "من هو ابن النفيس؟"]
  ]},
  { name: "بيت من الشعر", clues: [
    ["صاحب البيت: «الخيلُ والليلُ والبيداءُ تعرفني ... والسيفُ والرمحُ والقرطاسُ والقلمُ».", "من هو المتنبي؟"],
    ["بويع بلقب «أمير الشعراء» في القاهرة عام 1927.", "من هو أحمد شوقي؟"],
    ["مطلع معلّقته: «قِفا نبكِ من ذكرى حبيبٍ ومنزلِ».", "من هو امرؤ القيس؟"],
    ["قال في فتح عمّورية: «السيفُ أصدقُ إنباءً من الكتبِ».", "من هو أبو تمام؟"],

// ---------- Fuzzy answer matching (Levenshtein on normalized Arabic/English) ----------
const ANSWER_MS = 20000;
function norm(s) {
  s = String(s || "").toLowerCase()
    .replace(/[ً-ٰٟـ]/g, "")                 // harakat, dagger alef, tatweel
    .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي")
    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660)
    .replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim()
    .replace(/^(من|ما|مين|مين|شو|ايش|ماذا)\s+(هو|هي|هم|هما)\s+/, "")
    .replace(/^(who|what|where)\s+(is|are|was|were)\s+/, "");
  return s.split(" ").map(w => (/^(وال|ال)../.test(w) ? w.replace(/^(وال|ال)/, "") : w))
    .filter(w => w && !["the", "a", "an"].includes(w)).join(" ");
}
function lev(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// right: similarity >= 0.8 · close: 0.6–0.8 (host decides) · wrong: below
function judge(text, official, alts) {
  const a = norm(text).replace(/\s/g, "");
  if (!a) return { v: "wrong", sim: 0 };
  let best = 0;
  for (const v of [official, ...(alts || [])]) {
    const b = norm(v).replace(/\s/g, ""); if (!b) continue;
    let sim = 1 - lev(a, b) / Math.max(a.length, b.length);
    if (b.length >= 3 && a.includes(b) && a.length <= b.length + 8) sim = 1;
    best = Math.max(best, sim);
  }
  return { v: best >= 0.8 ? "right" : best >= 0.6 ? "close" : "wrong", sim: best };
}

  T = { phase: G && G.started ? "board" : "lobby", key: null, isWager: false, armed: false, winner: null, locked: [], penalty: {}, revealed: false, result: "",
        wagerFor: null, wagerInput: "", wagerAmt: 0, final: null, online,
        answerText: "", judge: "", deadline: 0, timer: null, attempts: [], undo: null, res: null, flashUntil: 0, flashTimer: null };
}
const curVal = () => T.isWager ? T.wagerAmt : VALUES[+T.key.split("-")[1]];
const clueAns = () => { const [c, r] = T.key.split("-").map(Number); return [CATS[c].clues[r][1], ALTS[c][r]]; };
function snapshot() {
  return { scores: G.players.map(p => [p.pid, p.score]), control: G.control, delta: Object.assign({}, G.delta),
    t: { armed: T.armed, winner: T.winner, locked: [...T.locked], revealed: T.revealed, result: T.result, res: T.res, answerText: T.answerText } };
}
function applyRight(pid, note) {
  const p = pf(pid); if (!p) return; const val = curVal();
  p.score += val; addDelta(pid, val); G.control = pid; T.revealed = true; T.armed = false; T.judge = ""; clearTimeout(T.timer);
  T.result = `${p.name} +${num(val)}${note ? " · " + note : ""}`; T.res = { pid, ok: true, val };
  saveG(); renderLeader();
}
function applyWrong(pid, note) {
  const p = pf(pid); if (!p) return; const val = curVal();
  p.score -= val; addDelta(pid, -val); T.judge = ""; clearTimeout(T.timer); T.res = { pid, ok: false, val };
  if (T.isWager) { T.revealed = true; T.result = `${p.name} −${num(val)}${note ? " · " + note : ""}`; }
  else {
    T.locked.push(pid); T.winner = null; T.answerText = ""; T.deadline = 0;
    const left = G.players.some(x => !T.locked.includes(x.pid));
    T.armed = left; if (!left) T.revealed = true;
  }

}
function startAnswerTimer() {

  T.timer = setTimeout(() => {
    const pid = T.winner;
    if (T.phase === "clue" && pid && !T.answerText && !T.revealed) {
      T.attempts.push({ pid, text: "", v: "none" }); T.undo = null;

// The clue in progress is saved too, so reloading the host screen picks up where it left off
const TKEY = "mws-host-turn-v1";
function saveT() { store.set(TKEY, Object.assign({}, T, { online: null, timer: null, flashTimer: null })); }
function restoreT() {
  const s = store.get(TKEY);
  if (!s || !s.phase || s.phase === "board" || s.phase === "lobby") return;
  Object.assign(T, s, { online: T.online, timer: null, undo: null, flashUntil: 0, flashTimer: null });
  if (T.phase === "clue" && T.winner && !T.answerText && !T.revealed) startAnswerTimer();
}
// A player who rejoins on a new phone or browser takes over their old seat
function repid(a, b) {
  const p = pf(a); if (p) p.pid = b;
  if (G.control === a) G.control = b;
  if (G.delta && a in G.delta) { G.delta[b] = G.delta[a]; delete G.delta[a]; }
  if (G.lastJoined === a) G.lastJoined = b;
  if (T.winner === a) T.winner = b;
  if (T.wagerFor === a) T.wagerFor = b;
  T.locked = T.locked.map(x => x === a ? b : x);
  if (T.penalty[a]) T.penalty[b] = T.penalty[a];
  T.attempts.forEach(x => { if (x.pid === a) x.pid = b; });
  if (T.res && T.res.pid === a) T.res.pid = b;
  if (T.final) for (const k of ["wagers", "answers", "marks", "verdict"]) {

const sameName = (x, y) => norm(x) === norm(y) && norm(x) !== "";
function joinUrl() { return location.origin + location.pathname + "?room=" + G.room; }
function makeQR(el, size) {
  if (!el) return;
  el.innerHTML = "";
  try { new QRCode(el, { text: joinUrl(), width: size, height: size, colorDark: "#111111", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { el.hidden = true; }
}

  G.players.forEach(p => { if (!p.g) p.g = "m"; });

  $("#finalBtn").onclick = () => { if (G.finalDone) { T.phase = "over"; drawOverlay(); pub(); } else startFinal(); };
  const rb = $("#resetBtn");

  };

  $("#overlay").addEventListener("change", e => { if (e.target.id === "wWho") { T.wagerFor = e.target.value; T.wagerInput = ""; drawOverlay(); pub(); } });

  connect(G.room, "host", {
    msg: hostMsg,
    presence: ps => { T.online = new Set(Object.keys(ps)); renderLeader(); if (T.phase === "lobby") drawOverlay(); },

function tickDrain() {
  const fill = document.getElementById("drainFill"), secs = document.getElementById("drainSecs");
  if (!fill || !T.deadline) return;
  const left = Math.max(0, T.deadline - Date.now());
  fill.style.width = (100 * left / ANSWER_MS) + "%";
  if (secs) secs.textContent = t("clue.seconds", { n: Math.ceil(left / 1000) });
}

function newGame() {
  G.players.forEach(p => p.score = 0);
  G.used = {}; G.wagers = freshWagers(); G.control = null; G.finalDone = false; G.started = false; G.delta = {};
  resetT(); saveG(); renderBoard(); renderLeader(); drawOverlay(); pub();
}

function renderBoard() {
  let h = CATS.map(c => `<div class="cat">${esc(c.name)}</div>`).join("");
  for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) {

    h += `<button class="tile" type="button" data-k="${k}" ${used ? "disabled" : ""} aria-label="${esc(CATS[c].name)} ${VALUES[r]}">${used ? "" : num(VALUES[r])}</button>`;
  }

}

function renderLeader() {
  const el = $("#leader"); if (!el) return;
  if (!G.players.length) { el.innerHTML = `<div class="emptycard">${th("board.empty")}</div>`; return; }
  const ranked = [...G.players].sort((a, b) => b.score - a.score);
  el.innerHTML = ranked.map((p, i) => {
    const d = (G.delta || {})[p.pid];
    const delta = d ? `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${num(d)}</span>` : "";
    return `<div class="pc">
      <span class="rank">${i + 1}</span>

function pub() {
  if (!G) return;
  let cat = "", val = 0;
  if (T.key) { const [c, r] = T.key.split("-").map(Number); cat = CATS[c].name; val = T.isWager ? T.wagerAmt : VALUES[r]; }
  if (T.phase === "final") cat = FINAL.category;
  send("state", {
    players: G.players.map(({ pid, name, score, g }) => ({ pid, name, score, g })),
    phase: T.phase, armed: T.armed, winner: T.winner, locked: T.locked, revealed: T.revealed, cat, val,
    wagerFor: (T.phase === "wager" || T.isWager) ? T.wagerFor : null,
    wagerMax: T.wagerFor ? maxFor(T.wagerFor) : 0,
    wagerSet: T.isWager,
    answering: T.phase === "clue" && !T.revealed && !T.answerText && (T.isWager ? !!T.wagerFor : !!T.winner),
    ansLeft: T.deadline ? Math.max(0, T.deadline - Date.now()) : 0,
    judging: T.phase === "clue" && !T.revealed && !!T.answerText,
    res: T.res,
    lastWrong: (!T.isWager && T.armed && T.res && !T.res.ok && pf(T.res.pid)) ? T.res.pid : "",
    final: T.final ? { stage: T.final.stage, w: Object.keys(T.final.wagers), a: Object.keys(T.final.answers) } : null
  });

}

function hostMsg(ev, p) {
  if (ev === "hello") return pub();
  const pid = String(p.pid || "").slice(0, 16); if (!pid) return;
  if (ev === "join") {
    const name = String(p.name || "").trim().slice(0, 24) || "لاعب";
    const g = p.g === "f" ? "f" : "m";
    // Same name as an existing player (or an explicit "I'm X" tap) means the same person coming back
    let claim = String(p.claim || "");
    if (!pf(claim)) { const m = G.players.find(x => x.pid !== pid && sameName(x.name, name)); claim = m ? m.pid : ""; }
    if (claim && claim !== pid) {
      G.players = G.players.filter(x => x.pid !== pid);
      repid(claim, pid);
    }
    const pl = pf(pid);
    if (pl) { pl.name = name; if (p.g) pl.g = g; }
    else { G.players.push({ pid, name, score: 0, g }); G.lastJoined = pid; }
    saveG(); renderLeader(); if (T.phase !== "board") drawOverlay(); return pub();
  }
  const pl = pf(pid); if (!pl) return;
  if (ev === "buzz") {
    const now = performance.now();
    if (T.phase !== "clue" || T.isWager || T.revealed) return;
    if (p.early) { if (!T.armed && !T.winner) T.penalty[pid] = now + 250; return; }
    if (!T.armed || T.winner || T.locked.includes(pid)) return;
    if ((T.penalty[pid] || 0) > now) return;
    T.winner = pid; T.armed = false; T.undo = null; startAnswerTimer(); beep();
    T.flashUntil = Date.now() + 1300; clearTimeout(T.flashTimer); T.flashTimer = setTimeout(drawOverlay, 1350);
    drawOverlay(); pub();
  } else if (ev === "ans") {
    if (T.phase !== "clue" || T.revealed || T.answerText) return;
    if (T.isWager ? pid !== T.wagerFor : pid !== T.winner) return;
    const text = String(p.text || "").trim().slice(0, 140); if (!text) return;
    T.answerText = text; clearTimeout(T.timer);
    const [official, alts] = clueAns();
    const j = judge(text, official, alts);
    T.attempts.push({ pid, text, v: j.v });
    if (j.v === "close") T.judge = "close";
    else { T.undo = snapshot(); j.v === "right" ? applyRight(pid, t("clue.auto")) : applyWrong(pid, t("clue.auto")); }
    T.flashUntil = 0; drawOverlay(); pub();
  } else if (ev === "wager") {
    if (T.phase !== "wager" || T.wagerFor !== pid) return;
    const v = Math.round(+p.amount);
    if (!(v >= 5 && v <= maxFor(pid))) return;
    T.wagerInput = String(v); drawOverlay(); pub();
  } else if (ev === "fin") {
    const F = T.final; if (!F) return;
    if (p.kind === "wager" && F.stage === "wager") {
      const v = Math.round(+p.value), mx = Math.max(pl.score, 0);
      if (!(v >= 0 && v <= mx)) return;
      F.wagers[pid] = v;
    } else if (p.kind === "answer" && F.stage === "answer") {
      F.answers[pid] = String(p.value || "").trim().slice(0, 140);
    } else return;
    drawOverlay(); pub();
  }
}

let actx;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), tt = actx.currentTime;
    o.type = "square"; o.frequency.setValueAtTime(660, tt); o.frequency.setValueAtTime(990, tt + .09);
    g.gain.setValueAtTime(.12, tt); g.gain.exponentialRampToValueAtTime(.001, tt + .4);
    o.connect(g).connect(actx.destination); o.start(tt); o.stop(tt + .42);
  } catch (e) {}
}

function openTile(k) {
  resetT(); T.key = k; G.delta = {};
  if (G.wagers.includes(k)) {
    T.phase = "wager";
    T.wagerFor = pf(G.control) ? G.control : (G.players[0] ? G.players[0].pid : null);
  } else T.phase = "clue";
  saveG(); renderLeader(); drawOverlay(); pub();
}

function startFinal() {
  resetT(); G.delta = {}; T.phase = "final"; T.final = { stage: "wager", wagers: {}, answers: {}, marks: {} };
  saveG(); renderLeader(); drawOverlay(); pub();

function drawOverlay() {
  const ov = $("#overlay");
  if (T.phase === "board") { ov.hidden = true; ov.innerHTML = ""; ov.className = "ov"; return; }
  let html = "", cls = "dots";
  if (T.phase === "lobby") html = lobbyView();
  else if (T.phase === "clue" && T.flashUntil > Date.now() && T.winner) { html = flashView(); cls = "dots"; }
  else if (T.phase === "clue") html = clueView();
  else if (T.phase === "wager") { html = wagerView(); cls = "hatch"; }
  else if (T.phase === "final") { html = finalView(); cls = "dots-dark"; }
  else if (T.phase === "over") html = overView();
  const focusedId = document.activeElement && ov.contains(document.activeElement) ? document.activeElement.id : null;
  ov.className = "ov " + cls;
  ov.innerHTML = html;
  ov.hidden = false;
  if (T.phase === "lobby") makeQR($("#qrBig"), 600);
  if (focusedId && document.getElementById(focusedId)) document.getElementById(focusedId).focus();
  tickDrain();
}

  const who = T.isWager ? T.wagerFor : T.winner, wg = gOf(who);

    const v = x.v === "right" ? t("clue.vRight") : x.v === "close" ? t("clue.vClose") : x.v === "none" ? t("clue.vNone", null, xg) : t("clue.vWrong");
    return `<div class="try"><span>${esc(nameOf(x.pid))}</span><span style="font-weight: 500;">${x.text ? "«" + esc(x.text) + "»" : th("clue.timeUp")}</span><span class="v ${x.v}">${esc(v)}</span></div>`;

  }
  const topBtns = T.revealed ? "" : `<div class="row"><button type="button" class="btn sm" data-act="reveal">${th("clue.noOne")}</button><button type="button" class="btn sm" data-act="cancel">${th("clue.cancel")}</button></div>`;
  return `<div class="scr" role="dialog" aria-modal="true">

        <span class="vchip">${T.isWager ? th("wager.title") + " " : ""}${num(val)}</span>
      </div>
      <p class="cluetxt">${esc(clue)}</p>
      ${tries}
    </div>
    <div class="bar">${bar}</div>
  </div>`;
}

function wagerView() {
  const [c] = T.key.split("-").map(Number);
  const back = `<button type="button" class="btn" data-act="cancel">${th("clue.back")}</button>`;
  if (!G.players.length) return `<div class="wcard" role="dialog" aria-modal="true"><div class="big">${th("wager.title")}</div><p class="line">${th("board.empty")}</p>${back}</div>`;

  return `<div class="wcard" role="dialog" aria-modal="true">

    <div class="line">${got ? th("wager.arrived", { name: p ? p.name : "" }) : th("wager.waiting", { name: p ? p.name : "" }, p ? p.g : "m")}</div>
    <div class="row" style="justify-content: center; font-weight: 700; font-size: 20px;">${th("wager.upTo", { max: num(maxFor(T.wagerFor)) })}</div>
    <div class="fields">
      <div class="field"><label for="wWho">${th("wager.who")}</label>
        <select id="wWho">${G.players.map(x => `<option value="${x.pid}" ${x.pid === T.wagerFor ? "selected" : ""}>${esc(x.name)} (${fmt(x.score)})</option>`).join("")}</select></div>
      <div class="field"><label for="wAmt">${th("wager.amount", { max: num(maxFor(T.wagerFor)) })}</label>

    </div>
    <p class="err" id="wErr"></p>
    <div class="row" style="justify-content: center;"><button type="button" class="btn dark big" data-act="wlock">${th("wager.lock")}</button>${back}</div>
  </div>`;

function finalView() {
  const F = T.final;
  const back = `<button type="button" class="btn ghost" data-act="fcancel">${th("clue.back")}</button>`;
  if (F.stage === "wager") {
    return `<div class="scr pad final" role="dialog" aria-modal="true" style="justify-content: space-between; gap: 32px;">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <span class="chip" style="align-self: flex-start; background: var(--saffron); color: var(--ink);">${th("final.badge")}</span>
        <div style="font-weight: 700; font-size: 24px; color: var(--muted);">${th("final.catLabel")}</div>
        <h2 class="extrude-dark">${esc(FINAL.category)}</h2>
        <div style="font-weight: 500; font-size: 24px; line-height: 1.6;">${th("final.instructions")}</div>
      </div>
      <div class="fcards">${G.players.map(p => {
        const done = F.wagers[p.pid] != null;
        const st = p.score <= 0 ? t("final.zero", null, p.g) : done ? t("final.wagered", null, p.g) : t("final.waitingWager");
        return `<div class="fcard ${done ? "done" : ""}"><div class="top"><span class="n">${esc(p.name)}</span><span class="s">${fmt(p.score)}</span></div><div class="st">${esc(st)}</div></div>`;
      }).join("")}</div>
      <div class="row fbtns"><button type="button" class="btn gold big" data-act="fclue">${th("final.showClue")}</button>${back}</div>
    </div>`;
  }
  if (F.stage === "answer") {
    return `<div class="scr pad final" role="dialog" aria-modal="true" style="justify-content: space-between; gap: 32px;">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <span class="chip" style="align-self: flex-start; background: var(--saffron); color: var(--ink);">${th("final.badge")} · ${esc(FINAL.category)}</span>
        <p class="cluetxt">${esc(FINAL.clue)}</p>
      </div>
      <div class="fcards">${G.players.map(p => {
        const done = F.answers[p.pid] != null;
        return `<div class="fcard ${done ? "done" : ""}"><div class="top"><span class="n">${esc(p.name)}</span></div><div class="st">${esc(done ? t("final.answered", null, p.g) : t("final.waitingAnswer", null, p.g))}</div></div>`;
      }).join("")}</div>
      <div class="row fbtns"><button type="button" class="btn gold big" data-act="freveal">${th("final.reveal")}</button></div>
    </div>`;
  }
  return `<div class="scr pad final" role="dialog" aria-modal="true" style="gap: 32px;">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span class="chip" style="align-self: flex-start; background: var(--saffron); color: var(--ink);">${th("final.badge")} · ${esc(FINAL.category)}</span>
      <div style="font-weight: 700; font-size: 17px; color: var(--muted);">${th("clue.answer")}</div>
      <div style="font-weight: 900; font-size: clamp(34px, 4vw, 56px); line-height: 1.4; color: var(--saffron);">${esc(FINAL.answer)}</div>
    </div>
    <div class="fcards">${G.players.map(p => `
      <div class="fcard ${F.marks[p.pid] === 1 ? "done" : ""}">
        <div class="top"><span class="n">${esc(p.name)}</span><span class="s">${th("final.wagerOf", { n: num(F.wagers[p.pid] || 0) })}</span></div>
        <div class="said">${F.answers[p.pid] ? "«" + esc(F.answers[p.pid]) + "»" : th("final.noAnswer", null, p.g)}</div>
        ${F.verdict && F.verdict[p.pid] === "close" ? `<div class="st">${th("clue.vClose")}</div>` : ""}
        <div class="row"><button type="button" class="btn sm ${F.marks[p.pid] === 1 ? "ok" : ""}" data-act="fmark" data-pid="${p.pid}" data-v="1">${th("clue.vRight")}</button><button type="button" class="btn sm ${F.marks[p.pid] === -1 ? "no" : ""}" data-act="fmark" data-pid="${p.pid}" data-v="-1">${th("clue.vWrong")}</button></div>
      </div>`).join("")}</div>
    <div class="row fbtns"><button type="button" class="btn gold big" data-act="ftally">${th("final.tally")}</button></div>
  </div>`;
}

function overView() {
  const ranked = [...G.players].sort((a, b) => b.score - a.score);
  if (!ranked.length) return `<div class="scr pad results"><h2>${th("over.title")}</h2><div class="row"><button type="button" class="btn" data-act="close">${th("over.close")}</button></div></div>`;
  const top = ranked[0].score, winners = ranked.filter(p => p.score === top);
  const head = winners.length > 1 ? t("over.tie", { names: winners.map(w => w.name).join(" و") }) : t("over.winner", { name: winners[0].name }, winners[0].g);
  return `<div class="scr pad results" role="dialog" aria-modal="true">
    <span class="chip" style="align-self: flex-start;">${th("over.title")}</span>
    <h2 class="extrude">${esc(head)}</h2>
    <div class="rlist">${ranked.map((p, i) => `<div class="pc"><span class="rank">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="sc ${p.score < 0 ? "neg" : ""}">${fmt(p.score)}</span></div>`).join("")}</div>
    <div class="row"><button type="button" class="btn dark big" data-act="newgame">${th("over.newGame")}</button><button type="button" class="btn" data-act="close">${th("over.close")}</button></div>
  </div>`;
}

function toBoard(markUsed) {
  if (markUsed && T.key) G.used[T.key] = 1;
  resetT(); saveG(); renderBoard(); renderLeader(); drawOverlay(); pub();
}

function hostAct(e) {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a !== "undo") T.undo = null;
  if (a === "start") { G.started = true; saveG(); T.phase = "board"; }
  else if (a === "arm") { T.armed = true; T.winner = null; }
  else if (a === "disarm") { T.armed = false; }
  else if (a === "right" || a === "wrong") {
    const pid = T.isWager ? T.wagerFor : T.winner; if (!pf(pid)) return;
    const last = T.attempts[T.attempts.length - 1];
    if (T.answerText && last && last.pid === pid) last.v = a;
    T.flashUntil = 0;
    a === "right" ? applyRight(pid, t("clue.hostCall")) : applyWrong(pid, t("clue.hostCall"));
  }
  else if (a === "undo") {
    const u = T.undo; if (!u) return;
    u.scores.forEach(([pid, s]) => { const p = pf(pid); if (p) p.score = s; });
    G.control = u.control; G.delta = u.delta; Object.assign(T, u.t); T.judge = "manual"; T.undo = null; clearTimeout(T.timer);
    const last = T.attempts[T.attempts.length - 1]; if (last) last.v = "close";
    saveG(); renderLeader();
  }
  else if (a === "reveal") { T.revealed = true; T.armed = false; T.winner = null; clearTimeout(T.timer); }
  else if (a === "cancel") return toBoard(false);
  else if (a === "done") return toBoard(true);
  else if (a === "wlock") {
    const v = parseNum(T.wagerInput), mx = maxFor(T.wagerFor);
    if (!v || v < 5 || v > mx) { $("#wErr").textContent = t("wager.error", { max: num(mx) }); return; }
    T.wagerAmt = v; T.isWager = true; T.phase = "clue";
  }
  else if (a === "fclue") { T.final.stage = "answer"; }
  else if (a === "freveal") {
    const F = T.final; F.stage = "reveal"; F.verdict = {};
    G.players.forEach(p => {
      const ans = F.answers[p.pid];
      const v = ans ? judge(ans, FINAL.answer, FINAL_ALTS).v : "none";
      F.verdict[p.pid] = v; F.marks[p.pid] = v === "right" ? 1 : v === "close" ? 0 : -1;
    });
  }
  else if (a === "fmark") { const pid = b.dataset.pid, v = +b.dataset.v; T.final.marks[pid] = T.final.marks[pid] === v ? 0 : v; }
  else if (a === "ftally") {
    const F = T.final;
    G.players.forEach(p => { const d = (F.marks[p.pid] || 0) * (F.wagers[p.pid] || 0); p.score += d; if (d) addDelta(p.pid, d); });
    G.finalDone = true; saveG(); renderLeader(); T.phase = "over"; T.final = null;
  }
  else if (a === "fcancel" || a === "close") return toBoard(false);
  else if (a === "newgame") return newGame();
  drawOverlay(); pub();
}

// =====================================================================
// PLAYER (phone)
// =====================================================================
const PKEY = "mws-player-v1";
let P, S = null, lastState = 0, penaltyUntil = 0, pending = false, sentWager = null, sentFin = {}, lastJoin = 0,
    lastView = "", editingName = false, wasWinner = false, sentAns = null, ansDeadline = 0, pickG = null;

const meG = () => P.g === "f" ? "f" : "m";
const sp = pid => S && S.players.find(x => x.pid === pid);
const spName = pid => (sp(pid) || {}).name || "";
const spG = pid => (sp(pid) || {}).g || "m";

function initPlayer() {
  P = store.get(PKEY) || {};
  if (!P.pid) P.pid = rid();
  store.set(PKEY, P);
  $("#app").innerHTML = `<div class="pl"><div class="phead" id="phead"></div><div class="pbody" id="pbody"></div><div class="pfoot" id="pfoot"></div></div>`;
  document.addEventListener("pointerdown", e => { if (e.target.closest("#buzz")) { e.preventDefault(); tap(); } });
  document.addEventListener("submit", onPlayerSubmit);
  document.addEventListener("click", e => {
    if (e.target.closest("#rename")) { editingName = true; pickG = P.g || null; lastView = ""; renderPlayer(); }
    const gb = e.target.closest("[data-g]");
    if (gb) { pickG = gb.dataset.g; document.querySelectorAll("[data-g]").forEach(x => x.classList.toggle("sel", x === gb)); document.querySelectorAll("[data-g]").forEach(x => x.setAttribute("aria-pressed", String(x === gb))); }
    const c = e.target.closest("[data-claim]");
    if (c && S) {
      const old = sp(c.dataset.claim); if (!old) return;
      P.name = old.name; P.g = old.g || "m"; store.set(PKEY, P); editingName = false;
      send("join", { pid: P.pid, name: P.name, g: P.g, claim: old.pid }); lastJoin = Date.now();
      lastView = ""; renderPlayer();
    }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && ch && Date.now() - lastState > 4000) reconnect(); });
  window.addEventListener("online", () => { if (ch) reconnect(); });
  if (roomParam.length === 4) startPlayerConn();
  renderPlayer();
  setInterval(renderPlayer, 1500);
  setInterval(() => {
    const f = document.getElementById("ptFill"), s = document.getElementById("ptSecs");
    if (!f || !ansDeadline) return;
    const left = Math.max(0, ansDeadline - Date.now());
    f.style.width = (100 * left / ANSWER_MS) + "%";
    if (s) s.textContent = t("clue.seconds", { n: Math.ceil(left / 1000) });
  }, 200);
}

function joinPayload() { return { pid: P.pid, name: P.name, g: meG() }; }

function startPlayerConn() {
  if (ch) return;
  connect(roomParam, P.pid, {
    msg: (ev, p) => {
      if (ev !== "state") return;
      S = p; lastState = Date.now();
      if (!S.armed || S.winner) pending = false;
      if (S.phase !== "wager") sentWager = null;
      if (!S.final) sentFin = {};
      if (!S.answering) sentAns = null;
      const me = sp(P.pid);
      if (!me && P.name && P.g && !editingName && Date.now() - lastJoin > 2000) { lastJoin = Date.now(); send("join", joinPayload()); }
      const iWin = S.phase === "clue" && S.winner === P.pid;
      if (iWin && !wasWinner && navigator.vibrate) navigator.vibrate([120, 60, 120]);
      wasWinner = iWin;
      renderPlayer();
    },
    status: st => {
      if (st === "SUBSCRIBED") { if (P.name && P.g && !editingName) { lastJoin = Date.now(); send("join", joinPayload()); } send("hello", {}); }
      renderPlayer();
    }
  });
}

let wakeLock = null;
async function wake() { try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch (e) {} }

function tap() {
  wake();
  if (!S || S.phase !== "clue" || S.wagerFor || S.revealed || S.winner || S.locked.includes(P.pid) || pending) return;
  const now = performance.now();
  if (now < penaltyUntil) return;
  if (S.armed) {
    pending = true; send("buzz", { pid: P.pid });
    setTimeout(() => { pending = false; renderPlayer(); }, 2000);
  } else {
    penaltyUntil = now + 250; send("buzz", { pid: P.pid, early: true });
    if (navigator.vibrate) navigator.vibrate(60);
    setTimeout(renderPlayer, 270);
  }
  renderPlayer();
}

function onPlayerSubmit(e) {
  const f = e.target.closest("form[data-f]"); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.f, inp = f.querySelector("input[type=text], input:not([type])"), err = f.querySelector(".err");
  const v = inp ? inp.value.trim() : "";
  if (kind === "code") {
    const code = v.toUpperCase().replace(/[^A-Z]/g, "");
    if (code.length !== 4) { err.textContent = t("join.codeError"); return; }
    location.search = "?room=" + code; return;
  }
  if (kind === "name") {
    const n = v.slice(0, 24);
    if (!n) { err.textContent = t("join.nameError"); return; }
    if (!pickG) { err.textContent = t("join.genderError"); return; }
    P.name = n; P.g = pickG; store.set(PKEY, P); editingName = false;
    lastJoin = Date.now();
    if (ch) send("join", joinPayload()); else startPlayerConn();
    lastView = ""; renderPlayer(); return;
  }
  if (kind === "wager") {
    const n = parseNum(v), mx = S ? S.wagerMax : 0;
    if (!n || n < 5 || n > mx) { err.textContent = t("wager.error", { max: num(mx) }); return; }
    send("wager", { pid: P.pid, amount: n }); sentWager = n; lastView = ""; renderPlayer(); return;
  }
  if (kind === "fwager") {
    const me = sp(P.pid), mx = Math.max(me ? me.score : 0, 0);
    const n = v === "" ? 0 : parseNum(v);
    if (isNaN(n) || n < 0 || n > mx) { err.textContent = t("pfinal.wagerLabel", { max: num(mx) }); return; }
    send("fin", { pid: P.pid, kind: "wager", value: n }); sentFin.wager = n; lastView = ""; renderPlayer(); return;
  }
  if (kind === "fanswer" || kind === "ans") {
    if (!v) { err.textContent = t("phone.answerError", null, meG()); return; }
    if (kind === "ans") { send("ans", { pid: P.pid, text: v }); sentAns = v; }
    else { send("fin", { pid: P.pid, kind: "answer", value: v }); sentFin.answer = v; }
    lastView = ""; renderPlayer(); return;
  }
}

// ---- view pieces ----
function slab(cls, big, tag) {
  return `<button type="button" id="buzz" class="slab s-${cls}" aria-label="${esc(big)}">${tag ? `<span class="tag">${esc(tag)}</span>` : "<span></span>"}<span class="big">${esc(big)}</span></button>`;
}
const meta = () => S && S.cat ? `<div class="pmeta"><span>${esc(S.cat)}</span><span>${S.val ? num(S.val) : ""}</span></div>` : "";
function msg(big, sub, cls, numHtml) {
  return `<div class="msg ${cls || ""}"><div class="big">${esc(big)}</div>${numHtml ? `<div class="num">${numHtml}</div>` : ""}${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>`;
}
function form(kind, title, label, btn, opts) {
  opts = opts || {};
  return `<form class="pcard" data-f="${kind}" autocomplete="off">
    ${opts.track ? `<div class="ptrack"><div class="fill" id="ptFill"></div></div>` : ""}
    ${opts.sub ? `<div class="sub">${opts.sub}</div>` : ""}
    <h2>${esc(title)}</h2>
    <label for="pf-${kind}" style="font-weight: 700; font-size: 15px;">${esc(label)}</label>
    <input id="pf-${kind}" type="text" ${opts.numeric ? 'inputmode="numeric"' : ""} ${opts.attrs || ""} value="${esc(opts.value || "")}" placeholder="${esc(opts.placeholder || "")}">
    ${opts.extra || ""}
    <p class="err"></p>
    <button type="submit" class="send">${esc(btn)}</button>
  </form>`;
}

function renderPlayer() {
  if (!P) return;
  const head = $("#phead"), body = $("#pbody"), foot = $("#pfoot");
  const live = S && Date.now() - lastState < 7000;
  const me = S ? sp(P.pid) : null, g = meG();
  const joined = P.name && P.g && roomParam.length === 4 && !editingName;
  head.innerHTML = joined
    ? `<div style="min-width: 0;"><div class="nm">${esc(P.name)}</div><div class="conn"><span class="dot ${live ? "on" : ""}"></span>${live ? th("join.connected", { code: roomParam }, g) : th("join.noHost")}</div></div><div class="sc ${me && me.score < 0 ? "neg" : ""}">${fmt(me ? me.score : 0)}</div>`
    : `<div class="nm" style="color: var(--saffron);">${th("name.title")}</div>`;

  let key, html;
  if (roomParam.length !== 4) {
    key = "code"; html = form("code", t("join.title"), t("join.codeLabel"), t("join.next"), { attrs: 'maxlength="4" autocapitalize="characters" dir="ltr"', placeholder: "ABCD" });
  } else if (!joined) {
    key = "name";
    const gp = pickG || P.g || null;
    html = form("name", t("join.nameTitle"), t("join.nameLabel"), t("join.join"), {
      value: P.name || "", placeholder: t("join.namePlaceholder"), attrs: 'maxlength="24"',
      extra: `<div style="font-weight: 700; font-size: 15px;">${th("join.genderLabel")}</div>
        <div class="gpick" role="group" aria-label="${th("join.genderLabel")}">
          <button type="button" class="btn ${gp === "m" ? "sel" : ""}" data-g="m" aria-pressed="${gp === "m"}">${th("join.male")}</button>
          <button type="button" class="btn ${gp === "f" ? "sel" : ""}" data-g="f" aria-pressed="${gp === "f"}">${th("join.female")}</button>
        </div>
        <div class="claims" id="claims"></div>`
    });
  } else if (!live) {
    key = "off"; html = slab("off", t("join.noHost"), t("join.noHostSub"));
  } else if (S.phase === "over") {
    const ranked = [...S.players].sort((a, b) => b.score - a.score);
    const rank = ranked.findIndex(x => x.pid === P.pid) + 1;
    key = "over" + rank; html = msg(t("over.title"), rank === 1 ? t("pfinal.won", null, g) : t("pfinal.rank", { n: rank }), rank === 1 ? "ok" : "");
  } else if (S.final) {
    const F = S.final, myScore = me ? me.score : 0;
    if (F.stage === "wager") {
      if (F.w.includes(P.pid) || sentFin.wager != null) { key = "fw-done"; html = msg(t("pfinal.wagerDone"), t("pfinal.wagerDoneSub", null, g)); }
      else if (myScore <= 0) { key = "fw-zero"; html = msg(t("pfinal.zero"), t("pfinal.zeroSub")); }
      else { key = "fw"; html = form("fwager", t("pfinal.title"), t("pfinal.wagerLabel", { max: num(myScore) }), t("wager.phoneSend"), { numeric: true, placeholder: "0", sub: `<span>${esc(S.cat)}</span>` }); }
    } else if (F.stage === "answer") {
      if (F.a.includes(P.pid) || sentFin.answer != null) { key = "fa-done"; html = msg(t("phone.sent"), ""); }
      else { key = "fa"; html = form("fanswer", t("pfinal.answerTitle", null, g), t("phone.answerLabel"), t("pfinal.answerSend"), {}); }
    } else { key = "fr"; html = msg(t("pfinal.look", null, g), t("pfinal.lookSub")); }
  } else if (S.phase === "lobby") {
    key = "lobby"; html = slab("idle", t("phone.idle", null, g), t("lobby.waiting"));
  } else if (S.phase === "wager") {
    if (S.wagerFor === P.pid && sentWager == null) { key = "w"; html = form("wager", t("wager.title"), t("wager.phoneLabel", { max: num(S.wagerMax) }), t("wager.phoneSend"), { numeric: true, sub: `<span>${esc(S.cat)}</span>` }); }
    else if (S.wagerFor === P.pid) { key = "w-sent"; html = msg(t("wager.phoneSent", { n: num(sentWager) }), t("wager.phoneSentSub")); }
    else { key = "w-other"; html = meta() + slab("idle", t("wager.title"), t("phone.wagerOther", { name: spName(S.wagerFor) }, spG(S.wagerFor))); }
  } else if (S.phase === "clue" && S.res && S.res.pid === P.pid && (S.revealed || !S.res.ok)) {
    key = "res" + S.res.ok + S.revealed;
    html = S.res.ok ? msg(t("phone.right"), "", "ok", "+" + num(S.res.val))
                    : (S.revealed ? msg(t("phone.wrong"), t("phone.over"), "bad", "−" + num(S.res.val))
                                  : meta() + slab("locked", t("phone.wrong"), t("phone.locked")));
  } else if (S.phase === "clue" && (S.wagerFor === P.pid || S.winner === P.pid) && !S.revealed && (S.answering || S.judging)) {
    if (S.answering && sentAns == null) {
      if (lastView !== "ans") ansDeadline = S.ansLeft ? Date.now() + S.ansLeft : 0;
      key = "ans"; html = form("ans", t("phone.yourTurn", null, g), t("phone.answerLabel"), t("phone.send"), {
        track: !!S.ansLeft, sub: `<span>${esc(S.cat)} · ${num(S.val)}</span><span id="ptSecs"></span>`
      });
    } else { key = "ans-sent"; html = msg(t("phone.sent"), S.judging ? t("phone.reviewing") : ""); }
  } else if (S.phase === "clue" && S.wagerFor) {
    key = "wc"; html = meta() + slab("idle", t("wager.title"), S.revealed ? t("phone.over") : t("phone.beatenSub", { name: spName(S.wagerFor) }, spG(S.wagerFor)));
  } else if (S.phase === "clue") {
    if (S.revealed) { key = "rev"; html = meta() + slab("idle", t("phone.over"), ""); }
    else if (performance.now() < penaltyUntil) { key = "pen"; html = meta() + slab("early", t("phone.early"), t("phone.earlySub")); }
    else if (S.locked.includes(P.pid)) { key = "locked"; html = meta() + slab("locked", t("phone.wrong"), t("phone.locked")); }
    else if (S.winner) { key = "lost" + S.winner; html = meta() + slab("beaten", t("phone.beaten", { name: spName(S.winner) }, spG(S.winner)), t("phone.beatenSub", { name: spName(S.winner) }, spG(S.winner))); }
    else if (pending) { key = "pending"; html = meta() + slab("pending", "…", ""); }
    else if (S.armed) { key = "ready" + S.lastWrong; html = meta() + slab("ready", t("phone.buzz", null, g), S.lastWrong ? t("phone.buzzAfterMiss", { name: spName(S.lastWrong) }, spG(S.lastWrong)) : ""); }
    else { key = "wait"; html = meta() + slab("wait", t("phone.listen", null, g), t("phone.listenSub", null, g)); }
  } else {
    key = "idle"; html = slab("idle", t("phone.idle", null, g), t("phone.idleSub"));
  }

  const isForm = ["code", "name", "w", "fw", "fa", "ans"].includes(key);
  if (key !== lastView || !isForm) body.innerHTML = html;
  lastView = key;
  // "Rejoin as" buttons, refreshed without wiping a name being typed
  const claims = document.getElementById("claims");
  if (claims) {
    const others = S ? S.players.filter(x => x.pid !== P.pid) : [];
    const h = others.length ? `<div style="font-weight: 700; font-size: 15px; line-height: 1.6;">${th("join.rejoin")}</div>
      <div class="row">${others.map(x => `<button type="button" class="btn sm" data-claim="${esc(x.pid)}">${th("join.rejoinBtn", { name: x.name })} (${fmt(x.score)})</button>`).join("")}</div>` : "";
    if (claims.dataset.h !== h) { claims.innerHTML = h; claims.dataset.h = h; }
  }
  foot.innerHTML = joined ? `<button type="button" class="linkbtn" id="rename">${th("join.rename")}</button>` : "";
}

// ---------- Boot ----------
if (IS_PLAYER) initPlayer(); else initHost();
</script>
</body>
</html>
